services:
  mongo:
    image: mongo
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express
    ports:
      - 8081:8081
    environment: 
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongo:27017
  backend:
    build: ./backend
    ports:
      - 5000:5000
    environment:
      PORT: 5000
      MONGO_URI: mongodb://admin:password@mongo:27017/testdb?authSource=admin
    depends_on:
      - mongo
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - 5173:5173
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
volumes:
  mongo-data:
